<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc"><title id="title">DualTrack architecture</title><desc id="desc">Speech and motion prior backbones exchange previous packet embeddings and fuse current hidden states before native packet prediction.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#668078" stroke-width="1.4"/></marker><style>text{font-family:Arial,sans-serif;fill:#20352e}.small{font-size:12px;fill:#65786e}.label{font-size:15px;font-weight:600}.path{fill:none;stroke:#668078;stroke-width:1.5;marker-end:url(#arrow)}</style></defs><rect width="1120" height="410" fill="#fff"/><text x="40" y="38" class="small" letter-spacing="2">DUALTRACK · ONE SPEECH / MOTION PACKET PAIR EVERY 80 ms</text><rect x="38" y="98" width="170" height="70" rx="9" fill="#edf3ed"/><text x="58" y="125" class="label">Previous speech</text><text x="58" y="148" class="small">16-code packet + text</text><rect x="38" y="260" width="170" height="70" rx="9" fill="#eef1fa"/><text x="58" y="287" class="label">Previous motion</text><text x="58" y="310" class="small">q0 … q15 embeddings</text><rect x="340" y="98" width="202" height="70" rx="9" fill="#e1eee5"/><text x="364" y="126" class="label">Speech backbone</text><text x="364" y="149" class="small">28 layers · 1024D</text><rect x="340" y="260" width="202" height="70" rx="9" fill="#e8ebf7"/><text x="364" y="287" class="label">MotionPrior</text><text x="364" y="310" class="small">4 + 2 temporal layers · 768D</text><path class="path" d="M208 125H340"/><path class="path" d="M208 302H340"/><path class="path" d="M208 152H244V231H304V277H340"/><path class="path" d="M208 278H274V197H306V147H340"/><text x="222" y="365" class="small">Causal residual history exchange</text><rect x="620" y="178" width="155" height="81" rx="9" fill="#176b56"/><text x="642" y="207" style="fill:white;font-size:15px;font-weight:600">Same-tick fusion</text><text x="642" y="231" style="fill:#d8ece2;font-size:12px">Shared MLP + residuals</text><path class="path" d="M542 133H590V194H620"/><path class="path" d="M542 295H590V242H620"/><rect x="852" y="98" width="222" height="70" rx="9" fill="#edf3ed"/><text x="875" y="126" class="label">Native speech heads</text><text x="875" y="149" class="small">Speech packet → waveform</text><rect x="852" y="260" width="222" height="70" rx="9" fill="#eef1fa"/><text x="875" y="287" class="label">q0 + depth heads</text><text x="875" y="310" class="small">Motion packet → tokenizer decode</text><path class="path" d="M775 197H812V133H852"/><path class="path" d="M775 240H812V295H852"/><text x="856" y="365" class="small">24 kHz speech · 25 Hz UMR499 motion</text><text x="40" y="393" class="small">Two persistent temporal caches · Native BOS at the first tick · 12.5 Hz shared token rate</text></svg>